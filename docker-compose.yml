services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam"]
      interval: 2s
      retries: 20

  iam:
    build: .
    env_file: .env
    environment:
      IAM_DATABASE_URL: postgres://iam:iam@postgres:5432/iam?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
