openapi: 3.0.3
info:
  title: IAM engine API
  version: "1.0"
  description: |
    Headless identity engine for B2B2C SaaS.

    **Authentication:** every `/v1` call needs `Authorization: Bearer <api key>`.
    Click **Authorize** and paste your key (`IAM_BOOTSTRAP_ADMIN_KEY` from `.env`).

    - *Instance key*: full access.
    - *Org key* (`POST /v1/orgs/{orgID}/api-keys`): only that org's resources.
    - *Scope*: `admin` keys use the management API; `login` keys only the
      Sessions and Auth requests API. Give your login UI backend a `login` key.

    Login UI backends should send the browser's IP in `X-End-User-IP` so rate
    limits and the audit trail apply per end user.

    Errors are returned as `{"error": "..."}`. `429` means rate limited; see `Retry-After`.
servers:
  - url: /
security:
  - apiKey: []
tags:
  - name: Orgs
  - name: API keys
  - name: Audit
  - name: Users
  - name: MFA
  - name: User grants
  - name: Projects
  - name: Roles
  - name: Apps
  - name: Project grants
  - name: Machine users
    description: Service accounts using the client credentials grant.
  - name: SSO
    description: Per-org external OpenID Connect identity providers.
  - name: Passkeys
  - name: Password reset
  - name: Sessions
    description: Headless login, called by your login UI backend.
  - name: Auth requests
    description: Pending OIDC authorization requests.

paths:
  /v1/api-keys:
    post:
      tags: [API keys]
      summary: Create instance-wide API key (instance key; returned once)
      requestBody: { $ref: "#/components/requestBodies/NewAPIKey" }
      responses:
        "201": { $ref: "#/components/responses/NewAPIKey" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [API keys]
      summary: List instance-wide API keys
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } }

  /v1/api-keys/{keyID}:
    parameters:
      - { name: keyID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [API keys]
      summary: Delete instance-wide API key
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/audit:
    get:
      tags: [Audit]
      summary: Instance-wide audit trail, newest first (instance key)
      parameters:
        - { $ref: "#/components/parameters/auditLimit" }
        - { $ref: "#/components/parameters/auditBefore" }
      responses:
        "200": { $ref: "#/components/responses/AuditEvents" }

  /v1/orgs/{orgID}/audit:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    get:
      tags: [Audit]
      summary: Org audit trail (logins, lockouts, admin actions), newest first
      parameters:
        - { $ref: "#/components/parameters/auditLimit" }
        - { $ref: "#/components/parameters/auditBefore" }
      responses:
        "200": { $ref: "#/components/responses/AuditEvents" }

  /v1/orgs:
    post:
      tags: [Orgs]
      summary: Create org (instance key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, example: Acme Inc }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", example: acme }
      responses:
        "201": { $ref: "#/components/responses/Org" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [Orgs]
      summary: List orgs (instance key)
      responses:
        "200":
          description: Orgs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Org" } }

  /v1/orgs/{orgID}:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    get:
      tags: [Orgs]
      summary: Get org
      responses:
        "200": { $ref: "#/components/responses/Org" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Orgs]
      summary: Delete org and everything in it (instance key)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/orgs/{orgID}/api-keys:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    post:
      tags: [API keys]
      summary: Create org-scoped API key (returned once)
      requestBody: { $ref: "#/components/requestBodies/NewAPIKey" }
      responses:
        "201": { $ref: "#/components/responses/NewAPIKey" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [API keys]
      summary: List org API keys
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } }

  /v1/orgs/{orgID}/api-keys/{keyID}:
    parameters:
      - { $ref: "#/components/parameters/orgID" }
      - { name: keyID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [API keys]
      summary: Delete API key
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/orgs/{orgID}/users:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                username:
                  type: string
                  description: Defaults to the email. 1-64 letters, digits, '.', '_' or '-'; may contain '@' only if it equals the email. Logins with '@' are matched by email.
                  example: alice
                email: { type: string, description: Unique per org (case-insensitive), example: alice@acme.com }
                email_verified: { type: boolean, description: Instance keys only; org keys use the verification flow }
                given_name: { type: string, example: Alice }
                family_name: { type: string, example: Doe }
                password:
                  type: string
                  minLength: 10
                  maxLength: 256
                  description: Must not contain the username or the email's local part.
                  example: S3cure-pass-2026
      responses:
        "201": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }

  /v1/orgs/{orgID}/projects:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    post:
      tags: [Projects]
      summary: Create project owned by this org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: My SaaS }
      responses:
        "201": { $ref: "#/components/responses/Project" }
    get:
      tags: [Projects]
      summary: List projects owned by this org
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }

  /v1/orgs/{orgID}/project-grants:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    get:
      tags: [Project grants]
      summary: List projects granted to this org
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectGrant" } }

  /v1/users/{userID}:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    get:
      tags: [Users]
      summary: Get user
      responses:
        "200": { $ref: "#/components/responses/User" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Users]
      summary: Update profile (omitted fields unchanged)
      description: Changing `email` clears `email_verified` unless `email_verified` is set in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                email_verified: { type: boolean }
                given_name: { type: string }
                family_name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/User" }
    delete:
      tags: [Users]
      summary: Delete user and revoke their tokens
      responses:
        "204": { description: Deleted }

  /v1/users/{userID}/password:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    put:
      tags: [Users]
      summary: Set password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10, maxLength: 256 }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }

  /v1/users/{userID}/lock:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Users]
      summary: Lock user (blocks sign-in and revokes all sessions and tokens)
      responses:
        "204": { description: Locked }

  /v1/users/{userID}/unlock:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Users]
      summary: Clear the manual lock and any temporary lockout
      description: After 5 failed attempts a user is locked out for 15 minutes automatically; this ends it early.
      responses:
        "204": { description: Unlocked }

  /v1/users/{userID}/email/verification:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Users]
      summary: Create an email verification code (instance key only)
      description: Returns a 6-digit code valid for 15 minutes. Your SaaS delivers it to the user's email; the engine sends no email.
      responses:
        "201":
          description: Code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "482913" }
                  email: { type: string }
                  expires_at: { type: string, format: date-time }

  /v1/users/{userID}/email/verify:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Users]
      summary: Confirm email with the code (instance key only, 5 attempts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: Email marked verified }
        "401": { $ref: "#/components/responses/Error" }

  /v1/users/{userID}/logout:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Users]
      summary: Revoke all sessions and tokens of the user
      responses:
        "204": { description: Revoked }

  /v1/users/{userID}/totp:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [MFA]
      summary: Start TOTP enrollment
      description: Returns the secret and an `otpauth://` URI to render as a QR code. Activate with `/totp/verify`.
      responses:
        "201":
          description: Pending secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [MFA]
      summary: Remove TOTP
      responses:
        "204": { description: Removed }

  /v1/users/{userID}/totp/verify:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [MFA]
      summary: Activate TOTP with a code from the authenticator app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "204": { description: TOTP active; login now requires it }
        "401": { $ref: "#/components/responses/Error" }

  /v1/users/{userID}/grants:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    get:
      tags: [User grants]
      summary: List user's role grants
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserGrant" } }
    post:
      tags: [User grants]
      summary: Assign project roles to user
      description: Roles must be within what the user's org was granted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, role_keys]
              properties:
                project_id: { type: string, format: uuid }
                role_keys: { type: array, items: { type: string }, example: [admin] }
      responses:
        "201": { $ref: "#/components/responses/UserGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/user-grants/{grantID}:
    parameters: [{ $ref: "#/components/parameters/grantID" }]
    patch:
      tags: [User grants]
      summary: Replace roles of a user grant
      requestBody: { $ref: "#/components/requestBodies/RoleKeys" }
      responses:
        "200": { $ref: "#/components/responses/UserGrant" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [User grants]
      summary: Delete user grant
      responses:
        "204": { description: Deleted }

  /v1/projects/{projectID}:
    parameters: [{ $ref: "#/components/parameters/projectID" }]
    get:
      tags: [Projects]
      summary: Get project (owner or granted org)
      responses:
        "200": { $ref: "#/components/responses/Project" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Projects]
      summary: Delete project (owner org)
      responses:
        "204": { description: Deleted }

  /v1/projects/{projectID}/roles:
    parameters: [{ $ref: "#/components/parameters/projectID" }]
    get:
      tags: [Roles]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
    post:
      tags: [Roles]
      summary: Add role (owner org)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/projects/{projectID}/roles/{roleKey}:
    parameters:
      - { $ref: "#/components/parameters/projectID" }
      - { name: roleKey, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Roles]
      summary: Delete role (also removed from all grants)
      responses:
        "204": { description: Deleted }

  /v1/projects/{projectID}/apps:
    parameters: [{ $ref: "#/components/parameters/projectID" }]
    get:
      tags: [Apps]
      summary: List apps
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/App" } }
    post:
      tags: [Apps]
      summary: Create OIDC app
      description: Web apps get a `client_secret`, shown only once. `spa` and `native` apps are public clients. Every interactive client (web, spa, native) must use PKCE (S256) on the authorization-code flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, app_type, redirect_uris, login_url]
              properties:
                name: { type: string, example: web }
                app_type: { type: string, enum: [web, spa, native] }
                auth_method: { type: string, enum: [client_secret_basic, client_secret_post, none] }
                redirect_uris: { type: array, items: { type: string }, example: ["http://localhost:3000/callback"] }
                post_logout_redirect_uris: { type: array, items: { type: string } }
                access_token_type: { type: string, enum: [jwt, bearer], default: jwt }
                login_url: { type: string, description: "Your login UI. Receives `?authRequest=<id>`.", example: "http://localhost:3000/login" }
                dev_mode: { type: boolean, description: Allow http redirect URIs. Dev only. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/App"
                  - type: object
                    properties:
                      client_secret: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /v1/apps/{appID}:
    parameters:
      - { name: appID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Apps]
      summary: Get app
      responses:
        "200":
          description: App
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
    delete:
      tags: [Apps]
      summary: Delete app
      responses:
        "204": { description: Deleted }

  /v1/projects/{projectID}/grants:
    parameters: [{ $ref: "#/components/parameters/projectID" }]
    get:
      tags: [Project grants]
      summary: List orgs this project is granted to
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectGrant" } }
    post:
      tags: [Project grants]
      summary: Grant project to a customer org (instance key only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, role_keys]
              properties:
                org_id: { type: string, format: uuid }
                role_keys: { type: array, items: { type: string }, example: [admin, member] }
      responses:
        "201": { $ref: "#/components/responses/ProjectGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/project-grants/{grantID}:
    parameters: [{ $ref: "#/components/parameters/grantID" }]
    patch:
      tags: [Project grants]
      summary: Replace granted roles (removed roles are stripped from users)
      requestBody: { $ref: "#/components/requestBodies/RoleKeys" }
      responses:
        "200": { $ref: "#/components/responses/ProjectGrant" }
    delete:
      tags: [Project grants]
      summary: Revoke grant (project owner), or leave the project (granted org)
      description: Also deletes the org's user grants for the project and revokes their tokens.
      responses:
        "204": { description: Revoked }

  /v1/orgs/{orgID}/machine-users:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    post:
      tags: [Machine users]
      summary: Create a machine user (service account)
      description: |
        Returns `client_id` and `client_secret` (shown once). Get tokens with
        `POST /oauth/token` `grant_type=client_credentials` (HTTP Basic auth). Add the
        scope `urn:iam:project:<project id>` to receive that project's roles in the token.
        Grant roles with the normal user grant endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: billing-sync }
      responses:
        "201": { description: Created; includes client_secret once }

  /v1/users/{userID}/client-secret:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Machine users]
      summary: Rotate a machine user's secret (old secret and tokens stop working)
      responses:
        "200": { description: New client_id and client_secret }

  /v1/orgs/{orgID}/idps:
    parameters: [{ $ref: "#/components/parameters/orgID" }]
    post:
      tags: [SSO]
      summary: Add an OpenID Connect identity provider for the org ("bring your own SSO", incl. Google/Microsoft)
      description: |
        Register the returned `callback_url` as redirect URI at the provider.
        `provider_type` selects a preset:
          - `oidc` (default): a generic provider; you supply `issuer` (https, public host).
          - `google`: Google accounts; issuer is pinned to `https://accounts.google.com`.
          - `microsoft`: Microsoft personal accounts (MSA) only; issuer pinned to the consumers tenant. Out of the initial supported scope and not live-validated — not recommended for production (see ROADMAP WS6).
          - `entra`: one Microsoft Entra ID directory; set `tenant` to the directory (tenant) GUID.
        For a preset the engine pins and validates the issuer, so `issuer` must be omitted and
        tokens from any other tenant/issuer are rejected. Outside dev mode a generic issuer must
        be https and on a public address. Multi-tenant Microsoft (`common`/`organizations`) is not
        supported in this release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, client_id, client_secret]
              properties:
                name: { type: string, example: Google }
                provider_type: { type: string, enum: [oidc, google, microsoft, entra], default: oidc }
                tenant: { type: string, description: "Entra directory (tenant) GUID; only with provider_type=entra", example: "11112222-3333-4444-5555-666677778888" }
                issuer: { type: string, description: "Generic (oidc) providers only; omit for presets", example: "https://acme.okta.com" }
                client_id: { type: string }
                client_secret: { type: string }
                scopes: { type: array, items: { type: string }, default: [openid, profile, email] }
                auto_create_users: { type: boolean, default: false, description: Create a user on first login (JIT) }
                link_by_email: { type: boolean, default: false, description: "Link to an existing user with the same verified email. Requires trust_email." }
                trust_email: { type: boolean, default: false, description: "Instance admin only: trust the IdP's email_verified claim" }
                trust_mfa: { type: boolean, default: false, description: "Instance admin only: an IdP login satisfies MFA (otherwise enrolled TOTP is still required)" }
                allowed_email_domains:
                  type: array
                  items: { type: string, example: acme.com }
                  description: Exact email domains whose IdP users may be provisioned or linked (a filter, not proof of identity). No wildcards.
      responses:
        "201": { description: Created; includes callback_url }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [SSO]
      summary: List the org's identity providers
      responses:
        "200": { description: Identity providers }

  /v1/orgs/{orgID}/idps/{idpID}:
    parameters:
      - { $ref: "#/components/parameters/orgID" }
      - { name: idpID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [SSO]
      summary: Remove an identity provider (its linked identities are removed too)
      responses:
        "204": { description: Deleted }

  /v1/orgs/{orgID}/idps/{idpID}/trust:
    parameters:
      - { $ref: "#/components/parameters/orgID" }
      - { name: idpID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SSO]
      summary: Set an IdP's trust policy (instance admin keys only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trust_email: { type: boolean }
                trust_mfa: { type: boolean }
      responses:
        "200": { description: Updated identity provider }
        "403": { $ref: "#/components/responses/Error" }

  /v1/federated-logins:
    post:
      tags: [SSO]
      summary: Start an SSO login; send the browser to auth_url
      description: |
        After the IdP login the browser returns to `return_url?intent=...&code=...`
        (or `&error=...`). Exchange intent and code at `/v1/federated-logins/{intentID}/redeem`.

        `browser_binding` ties the login to the browser that started it (login CSRF
        protection): at least 32 random bytes (base64url) that the login UI stores in an
        `HttpOnly`, `Secure`, `SameSite=Lax` cookie on its own origin. The redeem call must
        send the value from the returning browser's cookie.
      parameters: [{ $ref: "#/components/parameters/endUserIP" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, idp_id, return_url, browser_binding]
              properties:
                org: { type: string }
                idp_id: { type: string, format: uuid }
                return_url: { type: string, example: "https://app.example.com/sso-return" }
                browser_binding: { type: string, minLength: 43, maxLength: 512 }
      responses:
        "201":
          description: Intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent_id: { type: string }
                  auth_url: { type: string }

  /v1/federated-logins/{intentID}/redeem:
    parameters:
      - { name: intentID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SSO]
      summary: Exchange a completed SSO login for a session (single use, same browser only)
      description: A wrong or missing browser_binding fails with 401 and uses up the intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, browser_binding]
              properties:
                code: { type: string }
                browser_binding: { type: string, description: Value from the returning browser's cookie }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/password-resets:
    post:
      tags: [Password reset]
      summary: Issue a password reset token (your backend emails it)
      description: |
        Returns 202 with an empty body for unknown, locked and machine users and while the
        one-minute cooldown is active, so show the same message either way. Earlier tokens
        stay valid (at most three per user).
        Any login-scoped key can reset passwords of the users it serves.
      parameters: [{ $ref: "#/components/parameters/endUserIP" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, login_name]
              properties:
                org: { type: string }
                login_name: { type: string }
      responses:
        "202":
          description: Token (if the user exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  email: { type: string }
                  expires_at: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/Error" }

  /v1/password-resets/confirm:
    post:
      tags: [Password reset]
      summary: Set a new password with a reset token (single use; ends all sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/users/{userID}/passkeys/registration:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Passkeys]
      summary: Start passkey registration; pass the result to navigator.credentials.create()
      responses:
        "200": { description: PublicKeyCredentialCreationOptions (as `publicKey`) }

  /v1/users/{userID}/passkeys/registration/finish:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    post:
      tags: [Passkeys]
      summary: Finish registration with the browser's credential (JSON form)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                name: { type: string, example: MacBook }
                credential: { type: object, description: PublicKeyCredential.toJSON() }
      responses:
        "201": { description: Passkey stored }
        "401": { $ref: "#/components/responses/Error" }

  /v1/users/{userID}/passkeys:
    parameters: [{ $ref: "#/components/parameters/userID" }]
    get:
      tags: [Passkeys]
      summary: List the user's passkeys
      responses:
        "200": { description: Passkeys }

  /v1/users/{userID}/passkeys/{credentialID}:
    parameters:
      - { $ref: "#/components/parameters/userID" }
      - { name: credentialID, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Passkeys]
      summary: Remove a passkey
      responses:
        "204": { description: Deleted }

  /v1/sessions/{sessionID}/passkey/begin:
    parameters: [{ $ref: "#/components/parameters/sessionID" }]
    post:
      tags: [Sessions]
      summary: Start passkey login; pass the result to navigator.credentials.get()
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token: { type: string }
      responses:
        "200": { description: PublicKeyCredentialRequestOptions (as `publicKey`) }

  /v1/sessions/{sessionID}/passkey/finish:
    parameters: [{ $ref: "#/components/parameters/sessionID" }]
    post:
      tags: [Sessions]
      summary: Finish passkey login; a user-verified passkey alone authenticates the session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token, credential]
              properties:
                session_token: { type: string }
                credential: { type: object, description: PublicKeyCredential.toJSON() }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/sessions:
    post:
      tags: [Sessions]
      summary: Start login
      description: Succeeds for unknown login names too, so callers cannot discover which users exist; the password step then fails like a wrong password.
      parameters: [{ $ref: "#/components/parameters/endUserIP" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, login_name]
              properties:
                org: { type: string, description: Org id or slug, example: acme }
                login_name: { type: string, description: Username or email, example: alice }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/sessions/{sessionID}:
    parameters:
      - { $ref: "#/components/parameters/sessionID" }
      - { name: X-Session-Token, in: header, required: true, schema: { type: string } }
    get:
      tags: [Sessions]
      summary: Get session state
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Sessions]
      summary: End session
      responses:
        "204": { description: Deleted }

  /v1/sessions/{sessionID}/password:
    parameters: [{ $ref: "#/components/parameters/sessionID" }]
    post:
      tags: [Sessions]
      summary: Check password
      description: |
        `401` for a wrong password or unknown user (indistinguishable). After 5 failures the
        user is locked out for 15 minutes; during lockout a wrong password still returns `401`
        and only the correct password returns `423`.
      parameters: [{ $ref: "#/components/parameters/endUserIP" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token, password]
              properties:
                session_token: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/sessions/{sessionID}/totp:
    parameters: [{ $ref: "#/components/parameters/sessionID" }]
    post:
      tags: [Sessions]
      summary: Check TOTP code (when mfa_required)
      description: Requires the password step first. Each code is accepted only once.
      parameters: [{ $ref: "#/components/parameters/endUserIP" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token, code]
              properties:
                session_token: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth-requests/{authRequestID}:
    parameters: [{ $ref: "#/components/parameters/authRequestID" }]
    get:
      tags: [Auth requests]
      summary: Get pending auth request (to render the login page)
      responses:
        "200":
          description: Auth request
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  client_id: { type: string }
                  app_name: { type: string }
                  project_id: { type: string }
                  scopes: { type: array, items: { type: string } }
                  login_hint: { type: string }
                  prompt: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/auth-requests/{authRequestID}/finalize:
    parameters: [{ $ref: "#/components/parameters/authRequestID" }]
    post:
      tags: [Auth requests]
      summary: Complete auth request with an authenticated session
      description: Redirect the browser to the returned `callback_url`; the engine then redirects to the app with the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, session_token]
              properties:
                session_id: { type: string }
                session_token: { type: string }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  callback_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Instance or org API key

  parameters:
    orgID: { name: orgID, in: path, required: true, schema: { type: string, format: uuid } }
    userID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    projectID: { name: projectID, in: path, required: true, schema: { type: string, format: uuid } }
    grantID: { name: grantID, in: path, required: true, schema: { type: string, format: uuid } }
    sessionID: { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    authRequestID: { name: authRequestID, in: path, required: true, schema: { type: string, format: uuid } }
    endUserIP:
      name: X-End-User-IP
      in: header
      required: false
      description: The browser's IP, forwarded by your login UI backend.
      schema: { type: string, example: 203.0.113.7 }
    auditLimit: { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 500 } }
    auditBefore: { name: before, in: query, required: false, description: Return events with id below this (pagination), schema: { type: integer } }

  requestBodies:
    NewAPIKey:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, example: login ui }
              scope: { type: string, enum: [admin, login], default: admin }
              expires_in_days: { type: integer, minimum: 0, maximum: 3650, description: 0 or omitted means no expiry }
    RoleKeys:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [role_keys]
            properties:
              role_keys: { type: array, items: { type: string } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NewAPIKey:
      description: Created. `key` is shown only once.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/APIKey"
              - type: object
                properties:
                  key: { type: string }
    AuditEvents:
      description: Audit events
      content:
        application/json:
          schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
    Org:
      description: Org
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Org" }
    User:
      description: User
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }
    Project:
      description: Project
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Project" }
    ProjectGrant:
      description: Project grant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProjectGrant" }
    UserGrant:
      description: User grant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserGrant" }
    Session:
      description: Session state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Org:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        org_id: { type: string, format: uuid, nullable: true }
        scope: { type: string, enum: [admin, login] }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        org_id: { type: string, format: uuid, nullable: true }
        actor: { type: string, example: "api_key:6f1c…" }
        action: { type: string, example: login.succeeded }
        target: { type: string, example: "user:2b9e…" }
        ip: { type: string }
        detail: { type: object, additionalProperties: true }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        given_name: { type: string }
        family_name: { type: string }
        totp_enabled: { type: boolean }
        kind: { type: string, enum: [human, machine] }
        client_id: { type: string, description: Machine users only }
        locked: { type: boolean, description: Manual lock by an administrator }
        locked_until: { type: string, format: date-time, nullable: true, description: Temporary lockout after failed logins }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_org_id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Role:
      type: object
      required: [key]
      properties:
        key: { type: string, example: admin }
        display_name: { type: string, example: Admin }
    App:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        client_id: { type: string }
        app_type: { type: string }
        auth_method: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        post_logout_redirect_uris: { type: array, items: { type: string } }
        access_token_type: { type: string }
        login_url: { type: string }
        dev_mode: { type: boolean }
        created_at: { type: string, format: date-time }
    ProjectGrant:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        granted_org_id: { type: string, format: uuid }
        role_keys: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    UserGrant:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        role_keys: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        session_token: { type: string, description: Only returned on create }
        org_id: { type: string, format: uuid, description: Only after the password was verified }
        user_id: { type: string, format: uuid, description: Only after the password was verified }
        password_checked: { type: boolean }
        totp_checked: { type: boolean }
        passkey_checked: { type: boolean }
        idp_checked: { type: boolean }
        amr: { type: array, items: { type: string }, description: "How the user authenticated: pwd, otp, mfa, hwk, fed" }
        mfa_required: { type: boolean }
        authenticated: { type: boolean }
        expires_at: { type: string, format: date-time }
        auth_time: { type: string, format: date-time }
