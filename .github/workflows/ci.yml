name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Formatting, static analysis, build, unit + race/integration tests,
  # migration application (the engine and store tests migrate a disposable
  # Postgres), and OpenAPI parsing.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
          POSTGRES_DB: iam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iam"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      IAM_TEST_DATABASE_URL: postgres://iam:iam@localhost:5432/iam_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit + race + integration tests
        run: go test -race ./...
      - name: OpenAPI parse
        run: |
          python3 -c "import yaml; d=yaml.safe_load(open('internal/docs/openapi.yaml')); assert d['openapi'].startswith('3.'); print('OpenAPI', d['openapi'], 'paths', len(d['paths']))"

  # End-to-end smoke and feature suites against a real engine instance backed by
  # a disposable Postgres. The engine runs as its own OIDC IdP for the SSO tests,
  # so its issuer and listen port match (loopback discovery must resolve).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
          POSTGRES_DB: iam_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iam"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install python test deps
        run: pip install cryptography
      - name: start engine and run smoke + feature suites
        env:
          IAM_ISSUER: http://localhost:8080
          IAM_DATABASE_URL: postgres://iam:iam@localhost:5432/iam_e2e?sslmode=disable
          IAM_DEV_MODE: "true"
          IAM_WEBAUTHN_RP_ID: localhost
          IAM_WEBAUTHN_ORIGINS: http://localhost:3000,http://localhost:8080
        run: |
          set -euo pipefail
          export IAM_MASTER_KEY="$(openssl rand -base64 32)"
          export IAM_BOOTSTRAP_ADMIN_KEY="ci-bootstrap-$(openssl rand -hex 20)"
          go run ./cmd/iamd &
          engine_pid=$!
          trap 'kill $engine_pid 2>/dev/null || true' EXIT
          echo "waiting for engine..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/; then echo "engine up"; break; fi
            sleep 2
          done
          python3 scripts/smoke_test.py http://localhost:8080
          python3 scripts/features_test.py http://localhost:8080

  # Static analysis beyond go vet: gosec (security rules) and staticcheck.
  # Both are gates; reviewed false positives carry a //nosec justification.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gitleaks (secret scan)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner
      - name: gosec (security static analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet -severity medium -confidence medium ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  # Container image and infrastructure scan. govulncheck covers Go modules only;
  # this builds the runtime image and scans it with Trivy for OS and library
  # CVEs in the base layers that govulncheck cannot see, then scans the
  # Dockerfile and compose files for misconfiguration. The Trivy scanner is
  # pinned to an exact version for reproducible results. The vulnerability scan
  # gates on HIGH/CRITICAL that have a fix available: --ignore-unfixed means an
  # upstream CVE with no patch yet is reported in the log but does not wedge the
  # pipeline, matching the floating base-image tags (an image rebuild picks up
  # the fix as soon as upstream ships it).
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build runtime image
        run: docker build -t iam:ci .
      - name: export image for scanning
        run: docker save iam:ci -o /tmp/iam-ci.tar
      - name: trivy image scan (OS + library CVEs)
        run: |
          docker run --rm -v /tmp/iam-ci.tar:/image.tar:ro aquasec/trivy:0.58.1 \
            image --input /image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress
      - name: trivy config scan (Dockerfile + compose misconfig)
        run: |
          docker run --rm -v "$PWD":/repo:ro aquasec/trivy:0.58.1 \
            config /repo \
            --severity HIGH,CRITICAL \
            --exit-code 1
      # Emit a CycloneDX SBOM of the runtime image (its OS packages and the Go
      # module list baked into the binary) so every build has a machine-readable
      # bill of materials for provenance and later CVE triage (SUPPLY-05). This
      # is an inventory artifact, not a gate: it never fails the pipeline.
      - name: generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /tmp/iam-ci.tar:/image.tar:ro -v "$PWD":/out aquasec/trivy:0.58.1 \
            image --input /image.tar \
            --format cyclonedx --output /out/sbom.cdx.json
          ls -l sbom.cdx.json
      - name: upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
